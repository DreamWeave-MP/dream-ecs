base_url = "https://dreamweave-mp.github.io/dream-ecs"
title = "dream-ecs"
description = "A packed archetype and chunk entity component system for Jess, with JessQL as its query front end."
compile_sass = true
build_search_index = true
generate_feeds = true
feed_filenames = ["atom.xml"]
taxonomies = [{ name = "tags", feed = false }]

[search]
index_format = "fuse_json"
include_title = true
include_description = true
include_content = true
truncate_content_length = 400

[markdown]
highlighting = { theme = "dracula-soft" }
insert_anchor_links = "right"
smart_punctuation = true

[slugify]
paths = "safe"

[link_checker]
skip_prefixes = ["https://github.com/", "https://www.nexusmods.com/"]

[extra]
github_username = "DreamWeave-MP"
github_project = "dream-ecs"
logo_text = "dream-ecs"
palette = "teal"
menu_items = [
    { name = "dream-ecs", url = "@/home/index.md" },
    { name = "Network", url = "@/network.md" },
]

[extra.comments]
enabled = false
category = "General"
